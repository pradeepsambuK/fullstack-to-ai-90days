<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG in a Box</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.5rem; }
  textarea, input[type=text] { width: 100%; padding: 0.5rem; margin: 0.25rem 0 0.75rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  .answer { white-space: pre-wrap; background: #f4f4f4; padding: 1rem; border-radius: 6px; }
  .cite { color: #555; font-size: 0.9rem; }
  #status { color: #555; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>RAG in a Box</h1>
<p id="status">Checking status...</p>

<h2>1. Add documents</h2>
<input type="file" id="files" accept=".md,.txt" multiple>
<button onclick="uploadFiles()">Upload files</button>
<p>Or paste text:</p>
<input type="text" id="title" placeholder="Document title">
<textarea id="paste" rows="5" placeholder="Paste document text here..."></textarea>
<button onclick="ingestText()">Add text</button>

<h2>2. Ask a question</h2>
<input type="text" id="question" placeholder="What is RAG?">
<button onclick="ask()">Ask</button>
<div id="result"></div>

<script>
async function refreshStatus() {
  const res = await fetch('/health');
  const data = await res.json();
  document.getElementById('status').textContent =
    'Status: ' + data.status + ' | AI configured: ' + data.aiConfigured + ' (' + data.provider + ')' +
    (data.aiConfigured ? '' : ' — set your API key to ask questions.');
}
refreshStatus();

async function uploadFiles() {
  const input = document.getElementById('files');
  if (!input.files.length) { alert('Pick at least one .md or .txt file.'); return; }
  const form = new FormData();
  for (const f of input.files) form.append('files', f);
  const res = await fetch('/ingest', { method: 'POST', body: form });
  const data = await res.json();
  alert('Ingested: ' + JSON.stringify(data));
  refreshStatus();
}

async function ingestText() {
  const title = document.getElementById('title').value || 'untitled';
  const text = document.getElementById('paste').value;
  if (!text.trim()) { alert('Paste some text first.'); return; }
  const res = await fetch('/ingest-text', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, text })
  });
  const data = await res.json();
  alert('Ingested: ' + JSON.stringify(data));
}

async function ask() {
  const question = document.getElementById('question').value;
  if (!question.trim()) { alert('Type a question first.'); return; }
  const box = document.getElementById('result');
  box.innerHTML = '<p>Thinking...</p>';
  const res = await fetch('/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question })
  });
  const data = await res.json();
  if (!res.ok) {
    box.innerHTML = '<p><b>Error:</b> ' + (data.detail || data.title || res.statusText) + '</p>';
    return;
  }
  let html = '<h3>Answer</h3><div class="answer">' + escapeHtml(data.answer) + '</div>';
  if (data.citations && data.citations.length) {
    html += '<h3>Sources</h3>';
    for (const c of data.citations) {
      html += '<p class="cite">[' + c.index + '] ' + escapeHtml(c.documentTitle) +
        ' (score ' + c.score + ')<br>' + escapeHtml(c.snippet) + '</p>';
    }
  }
  box.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
</script>
</body>
</html>
